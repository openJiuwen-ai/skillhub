[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace_tools"
version = "0.0.1"
description = "Minimal Store service for openJiuwen marketplace"
requires-python = ">=3.11.4"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]>=0.35",
    "pydantic==2.11.7",
    "pydantic[email]==2.11.7",
    "python-dotenv==1.1.1",
    "sqlalchemy==2.0.41",
    "pydantic-settings==2.5.2",
    "pymysql==1.1.1",
    "cryptography",
    "python-multipart",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "packaging>=23.0",
    "pillow>=10.0.0,<12",
    "structlog>=24.1.0",
    "apscheduler>=3.10.0,<4.0",
    # retrival module dependencies
    "rich>=12.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "pymilvus>=2.4.0",
]

[tool.setuptools]
# 将入口 main.py 一并打包进 wheel，便于 Docker 多阶段构建后 python -m uvicorn main:app 启动
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["logs", "*.egg-info", "resources"]
include = ["*"]
