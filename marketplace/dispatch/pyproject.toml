[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-skillsdispatch"
version = "0.1.0"
description = "openJiuwen skills dispatch SDK for skill indexing, retrieval, and orchestration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "faiss-cpu>=1.7.0",
]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "indexing*",
    "models*",
    "orchestration*",
    "prompts*",
    "retrieval*",
    "shared*",
]
exclude = ["tests*", "data*"]

[tool.setuptools.package-data]
"prompts" = ["*.yaml"]
"retrieval.tree.render" = ["*.yaml"]
