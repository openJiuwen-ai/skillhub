# marketplace Deployment + Service
# 依赖：namespace.yaml、marketplace-config.yaml、Secret skillhub-secrets

apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-backend
  namespace: skillhub-system
  labels:
    app: skillhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillhub-backend
  template:
    metadata:
      labels:
        app: skillhub-backend
    spec:
      containers:
        - name: marketplace
          image: skillhub-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["main:app", "--host", "$(POD_IP)", "--port", "8100"]
          # 监听端口 8100 见通信矩阵第 16b、22 条；不声明 containerPort：该字段仅为元数据、不影响网络可达性；
          # 进程仅监听 Pod IP（见 --host $(POD_IP)），Service 为 ClusterIP（仅集群内部），不暴露公网。
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: marketplace-env
            - secretRef:
                name: skillhub-secrets
          startupProbe:
            httpGet: { path: /api/health, port: 8100 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: 8100 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8100 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-backend
  namespace: skillhub-system
spec:
  type: ClusterIP
  selector:
    app: skillhub-backend
  ports:
    - name: http
      port: 8100
      targetPort: 8100
