# Marketplace 业务 Secret 样例：生效项用于本轮基础市场试部署；其他受支持的
# 敏感配置按功能列在下方注释行。仅在启用相应功能时取消注释并填写真实值。
# 导入前替换所有生效项的占位值，真实凭据不要提交到 Git。
# 仅浏览而不启用 GitCode 登录时，可删去两项生效的 OAuth 凭据。
apiVersion: v1
kind: Secret
metadata:
  name: skillhub-backend-secrets
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD" # 数据库账号密码。
  MARKET_S3_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY" # MinIO/OBS static 访问密钥 ID。
  MARKET_S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY" # MinIO/OBS static 访问密钥。
  MARKET_GITCODE_OAUTH_CLIENT_ID: "REPLACE_WITH_GITCODE_CLIENT_ID" # GitCode OAuth 应用 ID。
  MARKET_GITCODE_OAUTH_CLIENT_SECRET: "REPLACE_WITH_GITCODE_CLIENT_SECRET" # GitCode OAuth 应用密钥。

  # 数据库：整串 URL 含密码时放这里；设置后优先于 ConfigMap 的 DB_* 拼装值。
  # STORE_DB_URL: "mysql+pymysql://USER:PASSWORD@HOST:3306/DB?charset=utf8mb4"

  # 系统管理员和其他 OAuth 提供方；Client ID 与 Secret 建议成对配置。
  # SYSTEM_ADMIN_TOKEN: "REPLACE_WITH_SYSTEM_ADMIN_TOKEN" # 使用 X-System-Token 时配置。
  # MARKET_GITHUB_OAUTH_CLIENT_ID: "REPLACE_WITH_GITHUB_CLIENT_ID"
  # MARKET_GITHUB_OAUTH_CLIENT_SECRET: "REPLACE_WITH_GITHUB_CLIENT_SECRET"
  # MARKET_AGENTOS_OAUTH_CLIENT_ID: "REPLACE_WITH_AGENTOS_CLIENT_ID"
  # MARKET_AGENTOS_OAUTH_CLIENT_SECRET: "REPLACE_WITH_AGENTOS_CLIENT_SECRET"

  # Redis / OBS dynamic：启用密码认证或 IAM 临时凭据时配置。
  # MARKET_REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  # HUAWEICLOUD_USERNAME: "REPLACE_WITH_IAM_USERNAME"
  # HUAWEICLOUD_PASSWORD: "REPLACE_WITH_IAM_PASSWORD"

  # 加密：本地 AES 用 Base64 编码的 32 字节主密钥；KMS 模式用加密后的根密钥。
  # SERVER_AES_MASTER_KEY: "REPLACE_WITH_AES_OR_KMS_ENCRYPTED_MASTER_KEY"

  # 检索：仅启用向量/LLM/标签分类时填写各自的 API Key。
  # MARKET_RETRIEVAL_EMBEDDING_API_KEY: "REPLACE_WITH_EMBEDDING_API_KEY"
  # MARKET_RETRIEVAL_MODEL_API_KEY: "REPLACE_WITH_RETRIEVAL_LLM_API_KEY"
  # MARKET_RETRIEVAL_SKILL_TAG_LLM_API_KEY: "REPLACE_WITH_TAG_LLM_API_KEY"

  # Skill 模型与 AI 审查：启用相应能力时分别配置，审查 Key 不隐式复用默认模型 Key。
  # MARKET_SKILL_MODEL_DEFAULT_API_KEY: "REPLACE_WITH_SKILL_MODEL_API_KEY"
  # MARKET_SKILL_REVIEW_MODEL_API_KEY: "REPLACE_WITH_REVIEW_MODEL_API_KEY"

  # 推荐：独立 Embedding 服务与可选 Milvus 鉴权。
  # MARKET_REC_EMBEDDING_API_KEY: "REPLACE_WITH_REC_EMBEDDING_API_KEY"
  # MARKET_MILVUS_PASSWORD: "REPLACE_WITH_MILVUS_PASSWORD"
