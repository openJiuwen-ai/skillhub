# Copy this file, configure your deployment and point
# MARKET_IDENTITY_EXTENSIONS_CONFIG at the copy's absolute path.
# Enable the enterprise channel with MARKET_IDENTITY_EXTENSIONS_ENABLED=true.
providers:
  enterprise:
    enabled_env: MARKET_IDENTITY_EXTENSIONS_ENABLED
    adapter: keycloak
    display_name: 企业账号登录
    settings:
      issuer: https://sso.example.com/realms/company
      client_id: skillhub
      client_secret_env: SKILLHUB_ENTERPRISE_SECRET
      redirect_uri: https://hub.example.com/api/v1/auth/extensions/enterprise/callback
      scopes: [openid, profile, email]
      token_endpoint_auth_method: client_secret_basic
      login_claim: preferred_username
      name_claim: name
      avatar_claim: picture
      algorithms: [RS256]
      # Ask for credentials on each new sign-in, including when an SSO session exists:
      # prompt: login
      # Development only, for a locally hosted Keycloak using HTTP:
      # allow_insecure_http: true
