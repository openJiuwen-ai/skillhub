# Shared raw identity configuration for direct, Docker, Kubernetes and OpenShift use.
# Despite the historical filename, this is NOT a Kubernetes ConfigMap manifest.
# Copy to your deployment configuration and replace the example settings.
# The keycloak channel is disabled; enable it AND the global gate explicitly.
# MARKET_IDENTITY_EXTENSIONS_ENABLED defaults to false.
# Point MARKET_IDENTITY_EXTENSIONS_CONFIG at the readable raw file in the backend.
# Kubernetes/OpenShift: create a ConfigMap with --from-file=identity-extensions.yaml=<file>.
# Keep the generated ConfigMap out of this source directory; do not apply this raw file.
providers:
  keycloak:
    enabled: false
    adapter: keycloak
    display_name: 企业账号登录
    settings:
      issuer: https://sso.example.com/realms/company
      client_id: skillhub
      client_secret_env: SKILLHUB_ENTERPRISE_SECRET
      redirect_uri: https://hub.example.com/api/v1/auth/oauth/keycloak/callback
      scopes: [openid, profile, email]
      token_endpoint_auth_method: client_secret_basic
      login_claim: preferred_username
      name_claim: name
      avatar_claim: picture
      algorithms: [RS256]
      # Verify TLS for Discovery, JWKS, Token and UserInfo; omitted also means true.
      # Use false only when explicitly accepting an unverified identity server.
      ssl_verify: true
      # Ask for credentials on each new sign-in, including when an SSO session exists:
      # prompt: login
      # Development only, for a locally hosted Keycloak using HTTP:
      # allow_insecure_http: true
