[project]
name = "skill-runner"
version = "0.1.0"
description = "Playground sandbox execution service for Skillhub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # k8s executor
    "kubernetes_asyncio>=32",
    "openjiuwen==0.1.15",
    # 多实例下外置每用户每日 token 预算（单实例不加载）
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["worker*", "executor*", "skill_runner*"]

[tool.uv]
default-groups = []
